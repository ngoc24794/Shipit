openapi: 3.0.3
info:
  title: Shipit API
  version: 0.1.0
  description: |
    Contract for the Shipit monolith. All routes except /healthz, /readyz and /api/auth/login
    require the admin session cookie (401 otherwise). Credential values are write-only:
    no response ever contains a secret value. ConfigMaps and Secrets in Job definitions are
    referenced by name only.
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: slaves
  - name: credentials
  - name: pipelines
  - name: runs
  - name: deploy-targets
  - name: jobs
  - name: job-allow-entries
  - name: search
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is up
          content:
            text/plain:
              schema: { type: string, example: ok }
  /readyz:
    get:
      tags: [health]
      summary: Readiness probe (database reachable, no pending migrations)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in as the admin user (sets session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204': { description: Logged in }
        '401': { description: Wrong user or password }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Clear the session cookie
      responses:
        '204': { description: Logged out }
  /api/auth/me:
    get:
      tags: [auth]
      summary: Current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/slaves:
    get:
      tags: [slaves]
      summary: List slaves
      responses:
        '200':
          description: Slaves
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slave' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [slaves]
      summary: Create a slave
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlaveInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slave' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/slaves/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [slaves]
      summary: Get a slave
      responses:
        '200':
          description: Slave
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slave' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [slaves]
      summary: Update a slave
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlaveInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slave' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [slaves]
      summary: Delete a slave (409 if a pipeline uses it)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/slaves/{id}/test:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [slaves]
      summary: Test the SSH connection to a slave
      responses:
        '200':
          description: Result of the connection test
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/credentials:
    get:
      tags: [credentials]
      summary: List credentials (metadata only, never values)
      responses:
        '200':
          description: Credentials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Credential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [credentials]
      summary: Create a credential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [credentials]
      summary: Update name and/or replace the secret value (value is optional; omit to keep it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [credentials]
      summary: Delete a credential (409 if in use)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/pipelines:
    get:
      tags: [pipelines]
      summary: List pipelines
      responses:
        '200':
          description: Pipelines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pipeline' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [pipelines]
      summary: Create a pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pipeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/pipelines/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [pipelines]
      summary: Get a pipeline
      responses:
        '200':
          description: Pipeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pipeline' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [pipelines]
      summary: Update a pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pipeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [pipelines]
      summary: Delete a pipeline (409 while a run is active)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/pipelines/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [runs]
      summary: Trigger a run (409 if this pipeline already has an active run)
      responses:
        '202':
          description: Run accepted and queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/runs:
    get:
      tags: [runs]
      summary: List runs, newest first
      parameters:
        - name: pipelineId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: jobId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [pipeline, job] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [queued, running, success, failed, cancelled] }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Runs
          headers:
            X-Total-Count:
              description: Total number of matching runs before pagination
              schema: { type: integer, format: int64 }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [runs]
      summary: Get a run with its steps
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/runs/{id}/logs:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [runs]
      summary: |
        Run log. With `Accept: text/event-stream` it streams Server-Sent Events: one `log` event per line
        (data is a LogLine JSON), plus a final `end` event carrying the run status. Otherwise returns the
        lines stored so far as JSON. `after` resumes after a given line sequence number.
      parameters:
        - name: after
          in: query
          required: false
          schema: { type: integer, format: int64, default: 0 }
      responses:
        '200':
          description: Log lines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LogLine' }
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/runs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [runs]
      summary: Cancel a queued or running run
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/deploy-targets:
    get:
      tags: [deploy-targets]
      summary: List allowed deployment targets
      responses:
        '200':
          description: Allowed deploy targets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeployTarget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [deploy-targets]
      summary: Add an allowed deployment target
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeployTargetInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeployTarget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/deploy-targets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [deploy-targets]
      summary: Delete an allowed deployment target
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Deploy target not found }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/jobs:
    get:
      tags: [jobs]
      summary: List jobs
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [jobs]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/jobs/validate:
    post:
      tags: [jobs]
      summary: Validate job configuration without saving
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobValidation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/jobs/preview:
    post:
      tags: [jobs]
      summary: Preview Kubernetes Job YAML generated for tasks
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '200':
          description: Preview result with generated YAML per task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [jobs]
      summary: Get a job
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [jobs]
      summary: Update a job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [jobs]
      summary: Delete a job (409 while a run is active)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/jobs/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [jobs]
      summary: Trigger a run (409 if this job already has an active run)
      responses:
        '202':
          description: Run accepted and queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/job-allow-entries:
    get:
      tags: [job-allow-entries]
      summary: List allowed job namespaces, configmaps, secrets and pull secrets
      responses:
        '200':
          description: Allowed job entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobAllowEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [job-allow-entries]
      summary: Add an allowed job entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobAllowEntryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAllowEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/job-allow-entries/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [job-allow-entries]
      summary: Delete an allowed job entry
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Job allow entry not found }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/search:
    get:
      tags: [search]
      summary: Global search across runs, pipelines, jobs, slaves, credentials, deploy targets and job allow entries
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: Grouped search results (empty groups omitted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: shipit_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Unauthorized:
      description: Not logged in
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
    Conflict:
      description: Conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [title]
      properties:
        title: { type: string }
        detail: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    Readiness:
      type: object
      required: [ready, database, pendingMigrations]
      properties:
        ready: { type: boolean }
        database: { type: string, enum: [ok, unreachable] }
        pendingMigrations: { type: integer }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        rememberMe: { type: boolean, default: false }
    Me:
      type: object
      required: [username]
      properties:
        username: { type: string }
    Slave:
      type: object
      required: [id, name, host, port, user, sshCredentialId]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        host: { type: string }
        port: { type: integer, default: 22 }
        user: { type: string }
        sshCredentialId: { type: integer, format: int64 }
    SlaveInput:
      type: object
      required: [name, host, user, sshCredentialId]
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer, default: 22 }
        user: { type: string }
        sshCredentialId: { type: integer, format: int64, description: Must reference a credential of kind ssh_key }
    ConnectionTestResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
    CredentialKind:
      type: string
      enum: [ssh_key, git_token, registry]
    Credential:
      type: object
      description: Metadata only. The secret value is never returned.
      required: [id, name, kind, hasValue]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { $ref: '#/components/schemas/CredentialKind' }
        username:
          type: string
          nullable: true
          description: Only for kind registry (the registry user name; not secret)
        hasValue: { type: boolean }
        updatedAt: { type: string, format: date-time }
    CredentialInput:
      type: object
      required: [name, kind, value]
      properties:
        name: { type: string }
        kind: { $ref: '#/components/schemas/CredentialKind' }
        username: { type: string, nullable: true, description: Required when kind is registry }
        value:
          type: string
          format: password
          description: Private key PEM, Git token or registry password. Write-only.
    CredentialUpdate:
      type: object
      properties:
        name: { type: string }
        username: { type: string, nullable: true }
        value: { type: string, format: password, description: Omit to keep the stored value }
    Pipeline:
      type: object
      required: [id, name, gitUrl, gitBranch, gitCredentialId, slaveId, dockerfilePath, buildContext, imageName, registryHost, deployRegistryHost, registryCredentialId, deployNamespace, deployDeployment, deployContainer]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        gitUrl: { type: string }
        gitBranch: { type: string, default: main }
        gitCredentialId: { type: integer, format: int64 }
        slaveId: { type: integer, format: int64 }
        dockerfilePath: { type: string, default: Dockerfile }
        buildContext:
          type: string
          nullable: true
          description: Relative path within repo for docker build context (. for repo root). Null defaults to the directory containing Dockerfile.
        imageName: { type: string, description: 'Repository name without registry host, e.g. shipit-demo' }
        registryHost: { type: string, example: 192.168.1.241 }
        deployRegistryHost:
          type: string
          nullable: true
          description: Host (and optional port) placed into the Deployment's image reference. Null/empty defaults to registryHost.
          example: 10.0.0.1:5000
        registryCredentialId: { type: integer, format: int64, nullable: true }
        deployNamespace: { type: string }
        deployDeployment: { type: string }
        deployContainer: { type: string }
        lastRun:
          allOf:
            - $ref: '#/components/schemas/Run'
          nullable: true
    PipelineInput:
      type: object
      required: [name, gitUrl, gitCredentialId, slaveId, imageName, registryHost, deployNamespace, deployDeployment, deployContainer]
      properties:
        name: { type: string }
        gitUrl: { type: string }
        gitBranch: { type: string, default: main }
        gitCredentialId: { type: integer, format: int64 }
        slaveId: { type: integer, format: int64 }
        dockerfilePath: { type: string, default: Dockerfile }
        buildContext:
          type: string
          nullable: true
          description: Relative path within repo for docker build context (. for repo root). Null/empty defaults to the directory containing Dockerfile.
        imageName: { type: string }
        registryHost: { type: string }
        deployRegistryHost:
          type: string
          nullable: true
          description: Host (and optional port) placed into the Deployment's image reference. Null/empty defaults to registryHost.
        registryCredentialId: { type: integer, format: int64, nullable: true }
        deployNamespace: { type: string }
        deployDeployment: { type: string }
        deployContainer: { type: string }
    RunStatus:
      type: string
      enum: [queued, running, success, failed, cancelled]
    StepName:
      type: string
      enum: [checkout, build, push, deploy, runjob]
    StepStatus:
      type: string
      enum: [pending, running, success, failed, skipped, cancelled]
    Run:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        pipelineId: { type: integer, format: int64, nullable: true }
        jobId: { type: integer, format: int64, nullable: true }
        kind: { type: string, enum: [pipeline, job] }
        status: { $ref: '#/components/schemas/RunStatus' }
        tag: { type: string, nullable: true, description: Short git sha, known after checkout }
        image: { type: string, nullable: true }
        failureReason: { type: string, nullable: true, description: 'e.g. step failed, or "interrupted"' }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    RunStep:
      type: object
      required: [name, status]
      properties:
        name: { $ref: '#/components/schemas/StepName' }
        status: { $ref: '#/components/schemas/StepStatus' }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    RunTask:
      type: object
      required: [position, label, status]
      properties:
        position: { type: integer }
        label: { type: string }
        status: { $ref: '#/components/schemas/StepStatus' }
        exitCode: { type: integer, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          required: [steps, tasks]
          properties:
            steps:
              type: array
              items: { $ref: '#/components/schemas/RunStep' }
            tasks:
              type: array
              items: { $ref: '#/components/schemas/RunTask' }
    LogLine:
      type: object
      required: [seq, step, stream, text, at]
      properties:
        seq: { type: integer, format: int64 }
        step: { $ref: '#/components/schemas/StepName' }
        stream: { type: string, enum: [stdout, stderr, system] }
        text: { type: string, description: Already masked; secrets are replaced by *** }
        at: { type: string, format: date-time }
        taskPosition: { type: integer, nullable: true, description: Null for pipeline runs; 0-based task index for job runs }
    DeployTarget:
      type: object
      required: [id, namespace, deployment, createdAt]
      properties:
        id: { type: integer, format: int64 }
        namespace: { type: string, example: devops }
        deployment: { type: string, example: shipit-demo }
        createdAt: { type: string, format: date-time }
    DeployTargetInput:
      type: object
      required: [namespace, deployment]
      properties:
        namespace: { type: string, example: devops }
        deployment: { type: string, example: shipit-demo }
    JobAllowKind:
      type: string
      enum: [namespace, configmap, secret, pullsecret]
    JobAllowEntry:
      type: object
      required: [id, namespace, kind, name, createdAt]
      properties:
        id: { type: integer, format: int64 }
        namespace: { type: string }
        kind: { $ref: '#/components/schemas/JobAllowKind' }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    JobAllowEntryInput:
      type: object
      required: [namespace, kind, name]
      properties:
        namespace: { type: string }
        kind: { $ref: '#/components/schemas/JobAllowKind' }
        name: { type: string }
    JobEnvVar:
      type: object
      description: Env var for a task. Plain value or a reference to a Secret key resolved by Kubernetes. Secret values are never stored or returned.
      properties:
        name: { type: string, nullable: true }
        value: { type: string, nullable: true }
        secretName: { type: string, nullable: true }
        secretKey: { type: string, nullable: true }
    JobTask:
      type: object
      description: One task in a Job. References ConfigMaps and Secrets by name only; secret values are never returned.
      required: [position, label, args, envFromConfigMaps, envFromSecrets, env, timeoutSeconds, backoffLimit, ttlSeconds]
      properties:
        position: { type: integer }
        label: { type: string }
        args:
          type: array
          items: { type: string }
        envFromConfigMaps:
          type: array
          items: { type: string }
        envFromSecrets:
          type: array
          items: { type: string }
        env:
          type: array
          items: { $ref: '#/components/schemas/JobEnvVar' }
        timeoutSeconds: { type: integer, default: 1800 }
        backoffLimit: { type: integer, default: 0 }
        ttlSeconds: { type: integer, default: 3600 }
    JobTaskInput:
      type: object
      required: [label]
      properties:
        label: { type: string }
        args:
          type: array
          items: { type: string }
        envFromConfigMaps:
          type: array
          items: { type: string }
        envFromSecrets:
          type: array
          items: { type: string }
        env:
          type: array
          items: { $ref: '#/components/schemas/JobEnvVar' }
        timeoutSeconds: { type: integer, nullable: true, default: 1800 }
        backoffLimit: { type: integer, nullable: true, default: 0 }
        ttlSeconds: { type: integer, nullable: true, default: 3600 }
    Job:
      type: object
      description: Job resource. All secret references (credentials, ConfigMaps, Secrets, ImagePullSecrets) are by ID or name; secret values are never returned.
      required: [id, name, gitUrl, gitBranch, gitCredentialId, slaveId, dockerfilePath, imageName, registryHost, namespace, containerName, imagePullSecrets, tasks]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        gitUrl: { type: string }
        gitBranch: { type: string, default: main }
        gitCredentialId: { type: integer, format: int64 }
        slaveId: { type: integer, format: int64 }
        dockerfilePath: { type: string, default: Dockerfile }
        buildContext:
          type: string
          nullable: true
          description: Relative path within repo for docker build context (. for repo root). Null defaults to the directory containing Dockerfile.
        imageName: { type: string, description: 'Repository name without registry host, e.g. shipit-demo' }
        registryHost: { type: string, example: 192.168.1.241 }
        deployRegistryHost:
          type: string
          nullable: true
          description: Host (and optional port) placed into the Job container image reference. Null/empty defaults to registryHost.
        registryCredentialId: { type: integer, format: int64, nullable: true }
        namespace: { type: string }
        containerName: { type: string }
        serviceAccount: { type: string, nullable: true }
        imagePullSecrets:
          type: array
          items: { type: string }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/JobTask' }
        lastRun:
          allOf:
            - $ref: '#/components/schemas/Run'
          nullable: true
    JobInput:
      type: object
      required: [name, gitUrl, gitCredentialId, slaveId, imageName, registryHost, namespace, containerName]
      properties:
        name: { type: string }
        gitUrl: { type: string }
        gitBranch: { type: string, default: main }
        gitCredentialId: { type: integer, format: int64 }
        slaveId: { type: integer, format: int64 }
        dockerfilePath: { type: string, default: Dockerfile }
        buildContext:
          type: string
          nullable: true
          description: Relative path within repo for docker build context (. for repo root). Null/empty defaults to the directory containing Dockerfile.
        imageName: { type: string }
        registryHost: { type: string }
        deployRegistryHost:
          type: string
          nullable: true
          description: Host (and optional port) placed into the Job container image reference. Null/empty defaults to registryHost.
        registryCredentialId: { type: integer, format: int64, nullable: true }
        namespace: { type: string }
        containerName: { type: string }
        serviceAccount: { type: string, nullable: true }
        imagePullSecrets:
          type: array
          items: { type: string }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/JobTaskInput' }
    JobValidation:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    JobPreviewTask:
      type: object
      required: [position, label, yaml]
      properties:
        position: { type: integer }
        label: { type: string }
        yaml: { type: string }
    JobPreview:
      type: object
      required: [errors, tasks]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/JobPreviewTask' }
    SearchItem:
      type: object
      required: [id, title, path]
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        path: { type: string }
    SearchGroup:
      type: object
      required: [kind, label, items]
      properties:
        kind:
          type: string
          enum: [run, pipeline, job, slave, credential, deploy-target, job-allow]
        label: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchItem' }
    SearchResponse:
      type: object
      required: [query, groups]
      properties:
        query: { type: string }
        groups:
          type: array
          items: { $ref: '#/components/schemas/SearchGroup' }
security:
  - sessionCookie: []
