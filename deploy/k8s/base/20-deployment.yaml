apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipit
  namespace: devops
  labels:
    app.kubernetes.io/name: shipit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shipit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipit
    spec:
      serviceAccountName: shipit
      imagePullSecrets:
        - name: registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
      containers:
        - name: app
          image: 192.168.1.241/shipit:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: shipit-secrets
          env:
            - name: SHIPIT_DEPLOY_ALLOWLIST
              value: '{"avina-workspace":["avina-catalog","avina-gateway","avina-users","avina-content-preview"],"devops":["shipit-demo"]}'
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
