apiVersion: v1
kind: ServiceAccount
metadata:
  name: shipit
  namespace: devops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shipit-deployer
  namespace: devops
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - shipit-demo
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipit-deployer
  namespace: devops
subjects:
  - kind: ServiceAccount
    name: shipit
    namespace: devops
roleRef:
  kind: Role
  name: shipit-deployer
  apiGroup: rbac.authorization.k8s.io
