apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipit-demo
  namespace: devops
  labels:
    app.kubernetes.io/name: shipit-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shipit-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipit-demo
    spec:
      serviceAccountName: default
      imagePullSecrets:
        - name: registry-secret
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: 192.168.1.241/shipit-demo:v0
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
