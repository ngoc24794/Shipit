apiVersion: batch/v1
kind: Job
metadata:
  name: shipit-migrate
  namespace: cicd
  labels:
    app.kubernetes.io/name: shipit
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipit
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
      containers:
        - name: migrate
          image: registry.local:5000/cicd-shipit:REPLACE_TAG
          args: ["--migrate"]
          env:
            - name: SHIPIT_MIGRATION_DB_URL
              valueFrom:
                secretKeyRef:
                  name: shipit-migration-secrets
                  key: SHIPIT_MIGRATION_DB_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
